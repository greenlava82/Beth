; SCBeatWiz band sync follower for the ESP32 "Cheap Yellow Display"
; (ESP32-2432S028R). See README.md in this folder.
;
;   pio run -e cyd -t upload     build and flash
;   pio device monitor           serial log (115200)
;   pio test -e native           decoder tests on this computer

[platformio]
default_envs = cyd

[env:cyd]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = huge_app.csv
lib_deps =
    h2zero/NimBLE-Arduino@2.5.1
    bodmer/TFT_eSPI@2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; TFT_eSPI setup for the CYD (instead of editing the library's User_Setup.h).
    -DUSER_SETUP_LOADED=1
    ; Display controller. Tested on a two-port (micro-USB + USB-C) board,
    ; which turned out to have an ILI9341 (the ST7789 driver left the screen
    ; white). If yours stays white, try the ST7789 line instead.
    -DILI9341_2_DRIVER=1
    ; -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    ; NimBLE: observer and central only, one connection (the details read).
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED=1
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

[env:native]
platform = native
test_build_src = no
